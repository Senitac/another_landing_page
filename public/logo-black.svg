<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Black version for light backgrounds -->

  <!-- Left loop -->
  <circle cx="170" cy="200" r="60" fill="none" stroke="#000000" stroke-width="16"/>
  <circle cx="170" cy="200" r="75" fill="none" stroke="#000000" stroke-width="12"/>
  <circle cx="170" cy="200" r="90" fill="none" stroke="#000000" stroke-width="8"/>

  <!-- Right loop -->
  <circle cx="342" cy="200" r="60" fill="none" stroke="#000000" stroke-width="16"/>
  <circle cx="342" cy="200" r="75" fill="none" stroke="#000000" stroke-width="12"/>
  <circle cx="342" cy="200" r="90" fill="none" stroke="#000000" stroke-width="8"/>

  <!-- Bottom left loop -->
  <circle cx="170" cy="312" r="60" fill="none" stroke="#000000" stroke-width="16"/>
  <circle cx="170" cy="312" r="75" fill="none" stroke="#000000" stroke-width="12"/>
  <circle cx="170" cy="312" r="90" fill="none" stroke="#000000" stroke-width="8"/>

  <!-- Bottom right loop -->
  <circle cx="342" cy="312" r="60" fill="none" stroke="#000000" stroke-width="16"/>
  <circle cx="342" cy="312" r="75" fill="none" stroke="#000000" stroke-width="12"/>
  <circle cx="342" cy="312" r="90" fill="none" stroke="#000000" stroke-width="8"/>

  <!-- Center connecting strokes -->
  <line x1="210" y1="140" x2="302" y2="140" stroke="#000000" stroke-width="20" stroke-linecap="round"/>
  <line x1="210" y1="165" x2="302" y2="165" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <line x1="210" y1="347" x2="302" y2="347" stroke="#000000" stroke-width="20" stroke-linecap="round"/>
  <line x1="210" y1="372" x2="302" y2="372" stroke="#000000" stroke-width="16" stroke-linecap="round"/>

  <!-- Center vertical connection -->
  <line x1="256" y1="180" x2="256" y2="332" stroke="#000000" stroke-width="24" stroke-linecap="round"/>
</svg>
