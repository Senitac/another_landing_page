<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="horizontal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Symbol -->
  <g transform="translate(50, 30)">
    <!-- Left loop -->
    <circle cx="55" cy="80" r="25" fill="none" stroke="url(#horizontal-gradient)" stroke-width="6"/>
    <circle cx="55" cy="80" r="32" fill="none" stroke="url(#horizontal-gradient)" stroke-width="5"/>
    <circle cx="55" cy="80" r="38" fill="none" stroke="url(#horizontal-gradient)" stroke-width="3"/>

    <!-- Right loop -->
    <circle cx="135" cy="80" r="25" fill="none" stroke="url(#horizontal-gradient)" stroke-width="6"/>
    <circle cx="135" cy="80" r="32" fill="none" stroke="url(#horizontal-gradient)" stroke-width="5"/>
    <circle cx="135" cy="80" r="38" fill="none" stroke="url(#horizontal-gradient)" stroke-width="3"/>

    <!-- Bottom left loop -->
    <circle cx="55" cy="160" r="25" fill="none" stroke="url(#horizontal-gradient)" stroke-width="6"/>
    <circle cx="55" cy="160" r="32" fill="none" stroke="url(#horizontal-gradient)" stroke-width="5"/>
    <circle cx="55" cy="160" r="38" fill="none" stroke="url(#horizontal-gradient)" stroke-width="3"/>

    <!-- Bottom right loop -->
    <circle cx="135" cy="160" r="25" fill="none" stroke="url(#horizontal-gradient)" stroke-width="6"/>
    <circle cx="135" cy="160" r="32" fill="none" stroke="url(#horizontal-gradient)" stroke-width="5"/>
    <circle cx="135" cy="160" r="38" fill="none" stroke="url(#horizontal-gradient)" stroke-width="3"/>

    <!-- Center connecting strokes -->
    <line x1="70" y1="55" x2="120" y2="55" stroke="url(#horizontal-gradient)" stroke-width="8" stroke-linecap="round"/>
    <line x1="70" y1="67" x2="120" y2="67" stroke="url(#horizontal-gradient)" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="185" x2="120" y2="185" stroke="url(#horizontal-gradient)" stroke-width="8" stroke-linecap="round"/>
    <line x1="70" y1="173" x2="120" y2="173" stroke="url(#horizontal-gradient)" stroke-width="6" stroke-linecap="round"/>

    <!-- Center vertical -->
    <line x1="95" y1="75" x2="95" y2="165" stroke="url(#horizontal-gradient)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- SENITAC Text -->
  <text x="280" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="700" fill="white" letter-spacing="-2">SENITAC</text>
</svg>
